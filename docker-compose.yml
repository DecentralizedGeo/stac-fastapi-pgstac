services:
  app:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:4.0.0
    container_name: stac-fastapi-pgstac
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=${PGSTAC_PORT}
      - RELOAD=true
      - ENVIRONMENT=local
      - postgres_user=${POSTGRES_USER}
      - postgres_pass=${POSTGRES_PASSWORD}
      - postgres_host_reader=database
      - postgres_host_writer=database
      - postgres_port=${DB_PORT}
      - postgres_dbname=${DB_NAME}
      - WEB_CONCURRENCY=10
      - VSI_CACHE=TRUE
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - DB_MIN_CONN_SIZE=1
      - DB_MAX_CONN_SIZE=1
      - USE_API_HYDRATE=${USE_API_HYDRATE:-false}
      - ENABLE_TRANSACTIONS_EXTENSIONS=TRUE
    ports:
      - ${PGSTAC_PORT}:${PGSTAC_PORT}
    depends_on:
      - database
    command: bash -c "chmod +x /app/scripts/wait-for-it.sh && /app/scripts/wait-for-it.sh database:${DB_PORT} && python -m stac_fastapi.pgstac.app"
    develop:
      watch:
        - action: rebuild
          path: ./stac_fastapi/pgstac

  database:
    container_name: stac-db
    image: ghcr.io/stac-utils/pgstac:v0.9.9
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${DB_NAME}
    ports:
      - 5439:${DB_PORT}
    command: postgres -N 500

  # Watch and auto-ingest collections when they change (Smart hash-based detection)
  watcher:
    container_name: collection-watcher
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:4.0.0
    environment:
      - ENVIRONMENT=local
    volumes:
      - ${ROOT_DIR}/scripts:/app/scripts
      - ${METADATA_WAREHOUSE}:/data-warehouse
      - ${ROOT_DIR}/state:/app/state
    command: >
      /bin/sh -c "
        scripts/wait-for-it.sh -t 60 app:${PGSTAC_PORT} &&
        python -m pip install pip -U &&
        python -m pip install requests &&
        echo 'Starting watcher service...' &&
        python /app/scripts/watch_and_ingest.py http://app:${PGSTAC_PORT} 300 /app/state/collection_hashes.json || (echo 'Watcher failed'; exit 1)
        "
    depends_on:
      - database
      - app
    restart: unless-stopped
